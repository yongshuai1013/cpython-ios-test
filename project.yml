name: CPyTest
options:
  bundleIdPrefix: com.yongshuai
deploymentTarget:
  iOS: "15.0"
targets:
  CPyTest:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    dependencies:
      # BeeWare Python-Apple-support 的真 CPython（CI 下載解壓到專案根目錄）
      - framework: Python.xcframework
        embed: true
    sources:
      - path: App/main.m
      - path: App/main.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongshuai.cpytest
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CPyTest
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
